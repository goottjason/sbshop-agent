name: Build images (GHCR)

on:
  workflow_dispatch:
    inputs:
      services:
        description: "빌드할 서비스(공백 구분: api frontend scraper). 비우면 전부"
        type: string
        default: ""
  workflow_call:
    inputs:
      services:
        type: string
        default: ""
    outputs:
      tag:
        description: "빌드한 이미지 태그(커밋 SHA 12자)"
        value: ${{ jobs.select.outputs.tag }}

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          WANT: ${{ inputs.services }}
        run: |
          case "$WANT" in
            *[!a-z\ ]*) echo "::error::서비스 이름은 소문자와 공백만 허용합니다: $WANT"; exit 1;;
          esac
          all='[{"service":"api","dockerfile":"Dockerfile.backend"},{"service":"frontend","dockerfile":"Dockerfile.frontend"},{"service":"scraper","dockerfile":"Dockerfile.scraper"}]'
          if [ -z "$(echo "$WANT" | tr -d ' ')" ]; then
            matrix="$all"
          else
            matrix="$(echo "$all" | jq -c --arg want "$WANT" '[.[] | select(.service as $s | ($want | split(" ") | index($s)) != null)]')"
          fi
          if [ "$matrix" = "[]" ]; then echo "::error::알 수 없는 서비스: $WANT"; exit 1; fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/goottjason/sbshop-agent-${{ matrix.service }}:${{ needs.select.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/goottjason/sbshop-agent-cache:${{ matrix.service }}
          cache-to: type=registry,ref=ghcr.io/goottjason/sbshop-agent-cache:${{ matrix.service }},mode=max,image-manifest=true,oci-mediatypes=true
