name: Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/build/reports/tests
            backend/**/build/test-results
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Browser fixtures
        working-directory: frontend
        run: SBSHOP_TEST_CHROME="$(command -v google-chrome)" npm run test:browser

  scraper-and-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: python -m pip install -r scraper/requirements.txt

      - name: Scraper regression tests (no external requests)
        working-directory: scraper
        run: |
          python -m unittest discover -s . -p 'test_*.py'
          python test_brand_detail.py

      - name: MarketPlus observer and parser tests
        run: |
          python -m unittest discover -s tools/marketplus -p 'test_*.py'
          python -m unittest discover -s tools/browser -p 'test_*.py'

      - name: Deployment and rollback regression tests
        run: |
          bash ops/test/deploy_test.sh
          bash ops/test/maintenance_test.sh
