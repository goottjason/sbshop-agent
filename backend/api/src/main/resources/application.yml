spring:
  application:
    name: sbshop-api
  devtools:
    livereload:
      enabled: false
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sbshop}
    username: ${DB_USERNAME:sbshop}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 엔티티 변경을 스키마에 자동 반영(추가만; DROP/변경 없음). 사용자 결정 2026-07-15.
      # 환경변수 DDL_AUTO로 오버라이드 가능(문제 시 none/validate로). create/create-drop 금지(데이터 삭제).
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080

cloud:
  cloudflare:
    r2:
      endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
      access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
      secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
      bucket: ${CLOUDFLARE_R2_BUCKET:sbshop-images}
      public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

coupang:
  api-url: https://api-gateway.coupang.com
  vendor-id: ${COUPANG_CLIENT_ID:}
  access-key: ${COUPANG_ACCESS_KEY:}
  secret-key: ${COUPANG_SECRET_KEY:}

smartstore:
  client-id: ${SMARTSTORE_CLIENT_ID:}
  client-secret: ${SMARTSTORE_CLIENT_SECRET:}
  api-url: https://api.commerce.naver.com/external

elevenst:
  api-key: ${ELEVENST_CLIENT_ID:}
  api-url: http://api.11st.co.kr

# Fortnum&Mason 등 브라우저 렌더 소싱 크롤을 담당하는 Python Scrapling 서비스(sbshop-scraper).
# 운영 배포 시 SCRAPER_BASE_URL로 사이드카 주소 지정(예: http://scraper:8099).
scraper:
  base-url: ${SCRAPER_BASE_URL:http://localhost:8099}

# ── 신규 상품 등록 자동화(소싱 파이프라인) ──────────────────────────────────────
# 아래 셋은 전부 "있으면 더 좋은" 선택적 의존이다. 미설정이어도 파이프라인은 돈다:
#   naver.*  없으면 → 국내 수요 신호를 결측 처리하고 나머지 신호로 정규화해 채점
#   zen.*    없으면 → 상품명·키워드를 규칙 기반으로 생성
#   customs.mfds는 인증키가 필요 없다(식품안전나라 공개 목록).

# 네이버 검색 API(쇼핑) — 경쟁 상품 수·국내 최저가. developers.naver.com, 일 25,000회 무료.
# 네이버 검색광고 API(키워드도구) — 월간 검색량·연관 키워드. 무료(광고계정 CUSTOMER_ID 필요).
naver:
  openapi:
    client-id: ${NAVER_OPENAPI_CLIENT_ID:}
    client-secret: ${NAVER_OPENAPI_CLIENT_SECRET:}
  searchad:
    api-key: ${NAVER_SEARCHAD_API_KEY:}
    secret-key: ${NAVER_SEARCHAD_SECRET_KEY:}
    customer-id: ${NAVER_SEARCHAD_CUSTOMER_ID:}

# OpenCode Zen — 상품명·키워드 생성용 LLM. 무료 모델만 쓴다(유료 API 미사용 방침).
# 모델은 앞에서부터 시도하고 실패하면 다음으로 넘어간다. 전부 실패하면 규칙 기반 폴백.
zen:
  base-url: ${ZEN_BASE_URL:https://opencode.ai/zen/v1}
  api-key: ${ZEN_API_KEY:}
  models: ${ZEN_MODELS:nemotron-3-ultra-free,ling-3.0-flash-free}

# 마켓 신규 등록 계정 고정값. 기본값은 라이브에서 검증된 실계정 값이라 보통 그대로 두면 된다.
# 스마트스토어 출고지·반품지 주소록 ID와 Cafe24 진열분류 번호는 여기 없다 — 마켓 API로 자동 조회·캐시한다.
# (자동 조회가 틀렸을 때만 market.smartstore.shipping-address-id 등으로 덮어쓴다.)
market:
  coupang:
    outbound-shipping-place-code: ${MARKET_COUPANG_OUTBOUND_CODE:1206157}
    return-center-code: ${MARKET_COUPANG_RETURN_CENTER:1000519746}
  smartstore:
    after-service-telephone: ${MARKET_SMARTSTORE_AS_TEL:010-2597-2480}
    # shipping-address-id / return-address-id: 미설정 시 커머스API 주소록에서 자동 조회
  elevenst:
    # D-092 라이브 검증값: 출고지 5(미국, outsideYnOut=Y) / 반품지 3(국내, outsideYnIn=N)
    # ⚠️ dlvCnAreaCd(=01 전국)는 '배송가능지역'이지 주소코드가 아니다.
    addr-seq-out: ${MARKET_ELEVENST_ADDR_SEQ_OUT:5}
    addr-seq-in: ${MARKET_ELEVENST_ADDR_SEQ_IN:3}
  cafe24:
    # default-category-no: 미설정 시 쇼핑몰 분류 목록에서 자동 매칭
    default-category-no: ${MARKET_CAFE24_CATEGORY_NO:}

# 식약처 해외직구 반입차단 원료·성분 목록(통관 게이트) — 인증키 불필요.
customs:
  mfds:
    base-url: ${MFDS_BASE_URL:https://www.foodsafetykorea.go.kr}

# 이메일 수집(EmailFetcherService)·검색(IherbEmailSearchService) 계정. 단일 백엔드라 여기 한 곳에서 관리.
# 소싱 계정들은 각자 Gmail 자동전달로 이 '중앙 계정' 인박스에 모으고, 시스템은 중앙 계정 하나만 읽는다.
sbshop:
  email:
    accounts:
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_CENTRAL_USERNAME:}
        password: ${EMAIL_CENTRAL_PASSWORD:}
        protocol: imaps
    # 전달을 못 거는 직접 수집 계정이 있으면 EMAIL_ACCOUNTS(=user:pass 목록) env로 추가 등록된다(EmailAccountProperties).

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
