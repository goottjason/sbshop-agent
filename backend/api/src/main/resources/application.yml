spring:
  application:
    name: sbshop-api
  devtools:
    livereload:
      enabled: false
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sbshop}
    username: ${DB_USERNAME:sbshop}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:after-migrate.sql
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

cloud:
  cloudflare:
    r2:
      endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
      access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
      secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
      bucket: ${CLOUDFLARE_R2_BUCKET:sbshop-images}
      public-url: ${CLOUDFLARE_R2_PUBLIC_URL:}

coupang:
  api-url: https://api-gateway.coupang.com
  vendor-id: ${COUPANG_CLIENT_ID:}
  access-key: ${COUPANG_ACCESS_KEY:}
  secret-key: ${COUPANG_SECRET_KEY:}

smartstore:
  client-id: ${SMARTSTORE_CLIENT_ID:}
  client-secret: ${SMARTSTORE_CLIENT_SECRET:}
  api-url: https://api.commerce.naver.com/external

elevenst:
  api-key: ${ELEVENST_CLIENT_ID:}
  api-url: http://api.11st.co.kr

sbshop:
  email:
    accounts:
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_USERNAME_1}
        password: ${EMAIL_PASSWORD_1}
        protocol: imaps
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_USERNAME_2}
        password: ${EMAIL_PASSWORD_2}
        protocol: imaps

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
