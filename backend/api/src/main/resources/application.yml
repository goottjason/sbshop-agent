spring:
  application:
    name: sbshop-api
  devtools:
    livereload:
      enabled: false
  main:
    banner-mode: off
  datasource:
    url: jdbc:postgresql://localhost:5432/sbshop
    username: sbshop
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
server:
  port: 8080

sbshop:
  email:
    accounts:
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_USERNAME_1}
        password: ${EMAIL_PASSWORD_1}
        protocol: imaps
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_USERNAME_2}
        password: ${EMAIL_PASSWORD_2}
        protocol: imaps

logging:
  level:
    org.hibernate.dialect.Dialect: ERROR
