spring:
  application:
    name: sbshop-api
  devtools:
    livereload:
      enabled: false
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/*.sql
      continue-on-error: true
server:
  port: 8080

sbshop:
  email:
    accounts:
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_USERNAME_1}
        password: ${EMAIL_PASSWORD_1}
        protocol: imaps
      - host: imap.gmail.com
        port: 993
        username: ${EMAIL_USERNAME_2}
        password: ${EMAIL_PASSWORD_2}
        protocol: imaps

logging:
  level:
    org.hibernate.dialect.Dialect: ERROR
