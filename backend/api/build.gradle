dependencies {
    implementation project(':core')
    implementation project(':infrastructure')
    
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // BCrypt for Naver API Signature
    implementation 'org.mindrot:jbcrypt:0.4'

    // Image resize (controller-level)
    implementation 'net.coobird:thumbnailator:0.4.20'

    // Swagger/OpenAPI docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // PostgreSQL — LISTEN/NOTIFY SSE 브리지(F-MISC-16)가 org.postgresql.PGConnection/PGNotification을
    // 컴파일 타임에 참조하므로 implementation으로 승격(기존 runtimeOnly는 드라이버 로딩만 가능).
    implementation 'org.postgresql:postgresql'

    // Testcontainers — 실 PostgreSQL 기반 @SpringBootTest 컨텍스트/마이그레이션 검증 (D-013)
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}
