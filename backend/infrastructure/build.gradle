dependencies {
    implementation project(':core')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.jsoup:jsoup:1.17.2'
    
    // Selenium WebDriver (ESM+ 웹 스크래핑용)
    implementation 'org.seleniumhq.selenium:selenium-java:4.16.1'
    
    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    
    // Flyway (Flyway 10.x는 Postgres 지원에 별도 database 모듈 필요 — 없으면 "Unsupported Database")
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Cloudflare R2 (via AWS S3 SDK v2)
    implementation 'software.amazon.awssdk:s3:2.24.0'

    // Image resize
    implementation 'net.coobird:thumbnailator:0.4.20'

    // HTTP client for image download
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

bootJar { enabled = false }
jar { enabled = true }
