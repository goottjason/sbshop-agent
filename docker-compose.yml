# sbshop-agent 전용 compose (2026-07-14 배포 라인 분리).
# 공유 인프라(postgres·nginx)는 ~/projects/infra 에서 별도 관리하며,
# 여기 컨테이너들은 external network 'shared-net' 에 붙어 postgres/nginx 와 통신한다.
# 배포: cd ~/projects/sbshop-agent && docker compose up -d --build  (GitHub Actions 가 수행)
services:
  sbshop-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: projects-sbshop-api-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-sbshop}
      DB_USERNAME: ${DB_USERNAME:-sbshop}
      DB_PASSWORD: ${PG_PASSWORD:-canagent1234}
      COUPANG_ACCESS_KEY: ${COUPANG_ACCESS_KEY}
      COUPANG_SECRET_KEY: ${COUPANG_SECRET_KEY}
      SMARTSTORE_CLIENT_ID: ${SMARTSTORE_CLIENT_ID}
      SMARTSTORE_CLIENT_SECRET: ${SMARTSTORE_CLIENT_SECRET}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY:-}
      CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-sbshop-images}
      CLOUDFLARE_R2_PUBLIC_URL: ${CLOUDFLARE_R2_PUBLIC_URL:-}
      EMAIL_CENTRAL_USERNAME: ${EMAIL_CENTRAL_USERNAME:-}
      EMAIL_CENTRAL_PASSWORD: ${EMAIL_CENTRAL_PASSWORD:-}
      EMAIL_ACCOUNTS: ${EMAIL_ACCOUNTS:-}
      SELENIUM_REMOTE_URL: http://sbshop-selenium:4444/wd/hub
      # Fortnum&Mason 등 소싱 크롤 담당 Scrapling 서비스. depends_on 없음(스크래퍼 장애가
      # api 기동을 막지 않도록) — 스크래퍼 미기동 시 F&M 배치는 안전하게 실패 기록만 남긴다.
      SCRAPER_BASE_URL: http://sbshop-scraper:8099
      # ── 신규 상품 등록 자동화(소싱 파이프라인) ──────────────────────────────
      # 전부 선택적. 비어 있어도 파이프라인은 돌고, 없으면 이렇게 동작한다:
      #   NAVER_OPENAPI_*   없으면 → 경쟁상품수·국내최저가 신호 결측(가중치에서 제외)
      #   NAVER_SEARCHAD_*  없으면 → 월간 검색량·연관키워드 결측
      #   ZEN_API_KEY       없으면 → 상품명·키워드를 규칙 기반으로 생성
      # 식약처 반입차단 성분 목록은 인증키가 필요 없다.
      NAVER_OPENAPI_CLIENT_ID: ${NAVER_OPENAPI_CLIENT_ID:-}
      NAVER_OPENAPI_CLIENT_SECRET: ${NAVER_OPENAPI_CLIENT_SECRET:-}
      NAVER_SEARCHAD_API_KEY: ${NAVER_SEARCHAD_API_KEY:-}
      NAVER_SEARCHAD_SECRET_KEY: ${NAVER_SEARCHAD_SECRET_KEY:-}
      NAVER_SEARCHAD_CUSTOMER_ID: ${NAVER_SEARCHAD_CUSTOMER_ID:-}
      ZEN_API_KEY: ${ZEN_API_KEY:-}
      # 마켓 등록 계정 고정값. 기본값을 application.yml과 똑같이 둔다 —
      # 빈 값을 넘기면(기본값 없는 치환) Spring이 그 빈 문자열을 채택해 yml 기본값이 무시된다.
      MARKET_SMARTSTORE_AS_TEL: ${MARKET_SMARTSTORE_AS_TEL:-010-2597-2480}
      MARKET_CAFE24_CATEGORY_NO: ${MARKET_CAFE24_CATEGORY_NO:-23}
    depends_on:
      - sbshop-selenium
    networks:
      - shared-net
    restart: unless-stopped

  # ESM+(G마켓/옥션) Selenium 스크래핑용 원격 그리드 (ARM64 지원 이미지)
  sbshop-selenium:
    image: seleniarm/standalone-chromium:latest
    container_name: projects-sbshop-selenium-1
    shm_size: "2g"
    networks:
      - shared-net
    restart: unless-stopped

  # Scrapling(Playwright) 소싱 스크래핑 서비스 — Fortnum&Mason 재고·가격·원가.
  sbshop-scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: projects-sbshop-scraper-1
    shm_size: "2g"
    networks:
      - shared-net
    restart: unless-stopped

  sbshop-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: projects-sbshop-frontend-1
    networks:
      - shared-net
    restart: unless-stopped

networks:
  shared-net:
    external: true
