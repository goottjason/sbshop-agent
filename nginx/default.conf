server {
    listen 80;
    server_name _;

    # ===== can-agent (기존) =====
    location /can-agent {
        proxy_pass http://can-agent:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===== sbshop-agent (신규) =====
    # API 요청 → Spring Boot 백엔드
    location /sbshop-agent/api/ {
        proxy_pass http://sbshop-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) 지원
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # 프론트엔드 (React) → sbshop-frontend 컨테이너
    location /sbshop-agent/ {
        proxy_pass http://sbshop-frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
